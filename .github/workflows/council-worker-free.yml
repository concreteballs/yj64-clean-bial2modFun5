name: YJ-64 Council — free GitHub Actions workers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yj64-council-free-workers
  cancel-in-progress: false

jobs:
  council-worker:
    name: Council worker ${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      SUPABASE_URL: ${{ secrets.YJ64_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.YJ64_SUPABASE_SERVICE_ROLE_KEY }}
      YJ64_COUNCIL_PROVIDER_CONFIG: ${{ secrets.YJ64_COUNCIL_PROVIDER_CONFIG }}
      YJ64_QUEUE_BACKEND: supabase
      YJ64_WORKER_ID: github-actions-${{ github.run_id }}-${{ matrix.slot }}
      YJ64_WORKER_CONCURRENCY: '1'
      YJ64_WORKER_POLL_SECONDS: '3'
      YJ64_WORKER_LEASE_SECONDS: '180'
      YJ64_ACTIONS_MAX_RUNTIME_SECONDS: '20400'
    steps:
      - name: Check required credentials without printing them
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$YJ64_COUNCIL_PROVIDER_CONFIG" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Council worker is idle: required Actions secrets have not been configured."
          fi

      - name: Check out repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_worker/requirements.txt

      - name: Install server dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r cloud_worker/requirements.txt

      - name: Run bounded Council worker
        if: steps.credentials.outputs.ready == 'true'
        run: python -m cloud_worker.github_actions_runner
