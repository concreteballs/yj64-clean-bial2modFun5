name: YJ-64 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'buildozer.spec'
      - 'main.py'
      - '**/*.py'
      - '**/*.java'
      - '**/*.json'
      - 'android_src/**'
      - 'services/**'
      - 'config/**'
      - 'p4a/**'
      - 'monitor-app/**'
      - 'tools/**'
      - 'PROTECTED-LINE-GUARD'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: yj64-android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-emulator-test:
    name: Build APKs and test on virtual Android
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo6 \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install pinned Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "Cython==0.29.36" \
            "virtualenv==20.29.3"

      - name: Cache Buildozer, Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: ${{ runner.os }}-yj64-buildozer-1.5.0-cython-0.29.36-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-yj64-buildozer-1.5.0-cython-0.29.36-

      - name: Verify protected Guard
        run: python tools/verify_guard.py

      - name: Compile project Python modules
        run: |
          python -m py_compile \
            main.py \
            chat_workspace.py \
            yj64_persistent_core.py \
            llm_api.py \
            llm_settings.py \
            message_distributor.py \
            services/internal_monitor.py \
            p4a/hook.py \
            tools/verify_guard.py

      - name: Run diagnostic spool unit tests
        run: python -m unittest discover -s tests -v

      - name: Build debug APKs (arm64 + x86_64)
        run: |
          buildozer android debug
          echo "Generated APKs:"
          find bin -maxdepth 1 -type f -name '*.apk' -print
          test -s bin/blackmirror-0.1.32-arm64-v8a-debug.apk
          test -s bin/blackmirror-0.1.32-x86_64-debug.apk

      - name: Install Monitor Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build standalone Monitor debug APK
        run: gradle --no-daemon -p monitor-app assembleDebug

      - name: Verify standalone Monitor APK
        run: |
          test -s monitor-app/app/build/outputs/apk/debug/app-debug.apk
          file monitor-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Boot virtual Android and test Base ↔ Monitor IPC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            BASE_APK="bin/blackmirror-0.1.32-x86_64-debug.apk"
            MONITOR_APK="monitor-app/app/build/outputs/apk/debug/app-debug.apk"

            adb wait-for-device
            adb install -r "$MONITOR_APK"
            adb install -r "$BASE_APK"

            adb shell am force-stop org.blackmirror.yj64monitor
            adb shell am force-stop org.blackmirror.blackmirror
            adb shell monkey -p org.blackmirror.yj64monitor 1
            sleep 3
            adb shell monkey -p org.blackmirror.blackmirror 1

            REPORT_PATH="files/yj64-reports/yj64-report.jsonl"
            RECEIVED=0
            for attempt in $(seq 1 60); do
              if adb exec-out run-as org.blackmirror.yj64monitor cat "$REPORT_PATH" 2>/dev/null | grep -q '"event":"self_diagnostic"'; then
                RECEIVED=1
                break
              fi
              sleep 2
            done

            echo "=== Monitor report from private app storage ==="
            adb exec-out run-as org.blackmirror.yj64monitor cat "$REPORT_PATH" || true
            echo "=== Base and Monitor process state ==="
            adb shell pidof org.blackmirror.blackmirror || true
            adb shell pidof org.blackmirror.yj64monitor || true
            echo "=== Relevant logcat ==="
            adb logcat -d -t 5000 | grep -E "AndroidRuntime|Python|python|blackmirror|yj64|FATAL EXCEPTION" | tail -n 250 || true

            if [ "$RECEIVED" -ne 1 ]; then
              echo "Base diagnostic report did not reach Monitor through Content Provider IPC." >&2
              exit 1
            fi

            REPORT="$(adb exec-out run-as org.blackmirror.yj64monitor cat "$REPORT_PATH")"
            echo "$REPORT" | grep -q '"event":"internal_startup"'
            echo "$REPORT" | grep -q '"event":"internal_service_ready"'
            echo "PASS: Base reports were durably received by Monitor over Android Content Provider IPC."

      - name: Verify APK output
        run: |
          mapfile -t apks < <(find bin -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced in bin/." >&2
            exit 1
          fi
          printf 'APK files found:\n'
          printf '%s\n' "${apks[@]}"
          echo "count=${#apks[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APKs and emulator test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yj64-android-debug-${{ github.run_number }}
          path: |
            bin/*.apk
            monitor-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yj64-android-build-logs-${{ github.run_number }}
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/**/*.log
          if-no-files-found: ignore
          retention-days: 3
