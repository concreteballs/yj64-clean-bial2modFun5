name: Council Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'llm_api.py'
      - 'cloud_worker/**'
      - 'tests/test_cloud_council_engine.py'
      - '.github/workflows/council-worker-ci.yml'
  pull_request:
    paths:
      - 'llm_api.py'
      - 'cloud_worker/**'
      - 'tests/test_cloud_council_engine.py'
      - '.github/workflows/council-worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r cloud_worker/requirements.txt
      - name: Compile worker and router
        run: python -m py_compile llm_api.py cloud_worker/engine.py cloud_worker/worker.py
      - name: Run Council adapter tests
        run: python -m unittest discover -s tests -p 'test_cloud_council_engine.py' -v
      - name: Build worker container
        run: docker build --pull -f cloud_worker/Dockerfile -t yj64-council-worker:ci .
