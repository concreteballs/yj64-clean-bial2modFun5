name: Council API smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/council-api/**'
      - 'supabase/config.toml'
      - '.github/workflows/council-api-smoke.yml'

permissions:
  contents: read

env:
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_rR7g4vyqvpgjhJjSMoYppA_yr59k8Yi

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public health endpoint and readiness gate
        env:
          API_BASE: https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rR7g4vyqvpgjhJjSMoYppA_yr59k8Yi
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$API_BASE/health")"
          cat /tmp/health.json
          test "$code" = "200"
          health="$(cat /tmp/health.json)"
          echo "$health" | jq -e '.api == "up" and .database == "up" and .ready_for_requests == false and .council_engine == "not_connected" and .worker == "not_deployed"'
      - name: Verify protocol header is mandatory
        env:
          API_BASE: https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/protocol.json --write-out '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$API_BASE/api/v1/external-agents/council/requests/00000000-0000-4000-8000-000000000001")"
          test "$code" = "400"
          jq -e '.error == "unsupported_protocol_version"' /tmp/protocol.json
      - name: Verify invalid machine credentials are rejected
        env:
          API_BASE: https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'X-YJ64-Protocol-Version: yj64.council-api.v1' \
            -H 'Authorization: Bearer deliberately-invalid-test-token-000000' \
            "$API_BASE/api/v1/external-agents/council/requests/00000000-0000-4000-8000-000000000001")"
          test "$code" = "401"
          jq -e '.error == "unauthorized" or .error == "unauthorized_or_scope_missing"' /tmp/auth.json
      - name: Verify Council submissions stay disabled without the real engine
        env:
          API_BASE: https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {
            "protocol_version": "yj64.council-api.v1",
            "agent_id": "smoke-test-agent",
            "correlation_id": "smoke-test-correlation",
            "idempotency_key": "smoke-test-idempotency-0001",
            "mode": "consensus",
            "task": {
              "title": "Smoke test",
              "prompt": "This request must not be accepted.",
              "context": {},
              "evidence_refs": []
            },
            "limits": {
              "max_rounds": 2,
              "timeout_seconds": 60,
              "max_output_tokens": 512,
              "minimum_critique_rounds": 1,
              "allow_early_stop": true
            },
            "voting": {"enabled": false, "weighted": false}
          }
          JSON
          code="$(curl --silent --output /tmp/gate.json --write-out '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'X-YJ64-Protocol-Version: yj64.council-api.v1' \
            -H 'Idempotency-Key: smoke-test-idempotency-0001' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "$API_BASE/api/v1/external-agents/council/requests")"
          test "$code" = "503"
          jq -e '.error == "council_engine_not_ready"' /tmp/gate.json
      - name: Verify result and cancel routes require machine authentication
        env:
          API_BASE: https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api
        run: |
          set -euo pipefail
          request_id="00000000-0000-4000-8000-000000000001"
          result_code="$(curl --silent --output /tmp/result-auth.json --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'X-YJ64-Protocol-Version: yj64.council-api.v1' \
            -H 'Authorization: Bearer deliberately-invalid-test-token-000000' \
            "$API_BASE/api/v1/external-agents/council/requests/$request_id/result")"
          test "$result_code" = "401"
          jq -e '.error == "unauthorized_or_scope_missing"' /tmp/result-auth.json
          cancel_code="$(curl --silent --output /tmp/cancel-auth.json --write-out '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'X-YJ64-Protocol-Version: yj64.council-api.v1' \
            -H 'Authorization: Bearer deliberately-invalid-test-token-000000' \
            -H 'Content-Type: application/json' \
            --data '{"protocol_version":"yj64.council-api.v1","agent_id":"smoke-test-agent"}' \
            "$API_BASE/api/v1/external-agents/council/requests/$request_id/cancel")"
          test "$cancel_code" = "401"
          jq -e '.error == "unauthorized_or_scope_missing"' /tmp/cancel-auth.json
