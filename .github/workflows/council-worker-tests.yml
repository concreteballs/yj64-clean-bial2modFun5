name: Council worker tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - 'tests/test_cloud_queue_store.py'
      - 'tests/test_cloud_postgres_queue_store.py'
      - 'tests/test_cloud_api.py'
      - 'tests/test_cloud_api_postgres_integration.py'
      - '.github/workflows/council-worker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - 'tests/test_cloud_queue_store.py'
      - 'tests/test_cloud_postgres_queue_store.py'
      - 'tests/test_cloud_api.py'
      - 'tests/test_cloud_api_postgres_integration.py'
      - '.github/workflows/council-worker-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yj64_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yj64_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yj64_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_worker/requirements.txt
      - name: Install pinned server dependencies
        run: python -m pip install -r cloud_worker/requirements.txt
      - name: Compile server modules and tests
        run: >-
          python -m py_compile llm_api.py
          cloud_worker/engine.py cloud_worker/queue_store.py
          cloud_worker/worker.py cloud_worker/api.py
          tests/test_cloud_council_engine.py
          tests/test_cloud_queue_store.py
          tests/test_cloud_postgres_queue_store.py
          tests/test_cloud_api.py
          tests/test_cloud_api_postgres_integration.py
      - name: Validate PostgreSQL owner/runtime initialization and grants
        env:
          YJ64_POSTGRES_PASSWORD: runtime-ci-password
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE yj64_owner NOLOGIN"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT CREATE ON SCHEMA public TO yj64_owner"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f cloud_worker/postgres/00-runtime-role.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE yj64_owner" -f cloud_worker/postgres/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f cloud_worker/postgres/02-runtime-grants.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE yj64_runtime" -c "SELECT request_id FROM public.yj64_council_api_requests LIMIT 0"
      - name: Run Council engine tests
        run: python -m unittest discover -s tests -p 'test_cloud_council_engine.py' -v
      - name: Run Supabase queue adapter tests
        run: python -m unittest discover -s tests -p 'test_cloud_queue_store.py' -v
      - name: Run PostgreSQL queue integration tests
        run: python -m unittest discover -s tests -p 'test_cloud_postgres_queue_store.py' -v
      - name: Run API validation tests
        run: python -m unittest discover -s tests -p 'test_cloud_api.py' -v
      - name: Run PostgreSQL API end-to-end tests
        run: python -m unittest discover -s tests -p 'test_cloud_api_postgres_integration.py' -v
      - name: Validate Docker Compose deployment configuration
        run: |
          cd cloud_worker
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          rm .env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build AMD64 and ARM64 OCI image
        run: >-
          docker buildx build --pull
          --platform linux/amd64,linux/arm64
          -f cloud_worker/Dockerfile
          -t yj64-council-worker:test
          --output type=oci,dest=/tmp/yj64-council-worker.oci.tar
          .
