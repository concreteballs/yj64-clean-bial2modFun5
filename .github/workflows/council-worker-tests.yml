name: Council worker tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - 'tests/test_cloud_queue_store.py'
      - 'tests/test_cloud_postgres_queue_store.py'
      - '.github/workflows/council-worker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - 'tests/test_cloud_queue_store.py'
      - 'tests/test_cloud_postgres_queue_store.py'
      - '.github/workflows/council-worker-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yj64_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yj64_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yj64_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_worker/requirements.txt
      - name: Install pinned worker dependencies
        run: python -m pip install -r cloud_worker/requirements.txt
      - name: Compile worker and shared provider router
        run: python -m py_compile llm_api.py cloud_worker/engine.py cloud_worker/queue_store.py cloud_worker/worker.py tests/test_cloud_council_engine.py tests/test_cloud_queue_store.py tests/test_cloud_postgres_queue_store.py
      - name: Run cloud Council engine tests
        run: python -m unittest discover -s tests -p 'test_cloud_council_engine.py' -v
      - name: Run queue store adapter tests
        run: python -m unittest discover -s tests -p 'test_cloud_queue_store.py' -v
      - name: Run PostgreSQL queue integration tests
        run: python -m unittest discover -s tests -p 'test_cloud_postgres_queue_store.py' -v
      - name: Build worker container
        run: docker build --pull -f cloud_worker/Dockerfile -t yj64-council-worker:test .
