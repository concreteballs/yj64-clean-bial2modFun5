name: Council worker tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - '.github/workflows/council-worker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'cloud_worker/**'
      - 'llm_api.py'
      - 'tests/test_cloud_council_engine.py'
      - '.github/workflows/council-worker-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud_worker/requirements.txt
      - name: Install pinned worker dependencies
        run: python -m pip install -r cloud_worker/requirements.txt
      - name: Compile worker and shared provider router
        run: python -m py_compile llm_api.py cloud_worker/engine.py cloud_worker/worker.py tests/test_cloud_council_engine.py
      - name: Run cloud Council engine tests
        run: python -m unittest discover -s tests -p 'test_cloud_council_engine.py' -v
      - name: Build worker container
        run: docker build --pull -f cloud_worker/Dockerfile -t yj64-council-worker:test .
