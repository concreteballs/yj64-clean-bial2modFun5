services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YJ64_POSTGRES_DB:-yj64}
      POSTGRES_USER: ${YJ64_POSTGRES_USER:-yj64_runtime}
      POSTGRES_PASSWORD: ${YJ64_POSTGRES_PASSWORD:?Set YJ64_POSTGRES_PASSWORD in .env}
    volumes:
      - yj64-postgres-data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-yj64-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No host port: PostgreSQL is reachable only on the private Compose network.

  council-worker:
    build:
      context: ..
      dockerfile: cloud_worker/Dockerfile
    image: yj64-council:latest
    init: true
    restart: unless-stopped
    environment:
      YJ64_QUEUE_BACKEND: postgres
      DATABASE_URL: postgresql://${YJ64_POSTGRES_USER:-yj64_runtime}:${YJ64_POSTGRES_PASSWORD:?Set YJ64_POSTGRES_PASSWORD in .env}@postgres:5432/${YJ64_POSTGRES_DB:-yj64}
      YJ64_DB_POOL_SIZE: ${YJ64_DB_POOL_SIZE:-12}
      YJ64_COUNCIL_PROVIDER_CONFIG: ${YJ64_COUNCIL_PROVIDER_CONFIG:?Set at least two provider routes in .env}
      YJ64_WORKER_POLL_SECONDS: ${YJ64_WORKER_POLL_SECONDS:-3}
      YJ64_WORKER_LEASE_SECONDS: ${YJ64_WORKER_LEASE_SECONDS:-180}
      YJ64_WORKER_CONCURRENCY: ${YJ64_WORKER_CONCURRENCY:-2}
      YJ64_WORKER_ID: ${YJ64_WORKER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 90s
    # No public inbound port: worker claims jobs from the shared PostgreSQL queue.

  council-api:
    build:
      context: ..
      dockerfile: cloud_worker/Dockerfile
    image: yj64-council:latest
    command:
      - uvicorn
      - cloud_worker.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --forwarded-allow-ips=127.0.0.1
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${YJ64_POSTGRES_USER:-yj64_runtime}:${YJ64_POSTGRES_PASSWORD:?Set YJ64_POSTGRES_PASSWORD in .env}@postgres:5432/${YJ64_POSTGRES_DB:-yj64}
      YJ64_API_DB_POOL_SIZE: ${YJ64_API_DB_POOL_SIZE:-8}
      YJ64_COUNCIL_ENGINE_ADAPTER: ${YJ64_COUNCIL_ENGINE_ADAPTER:-not_ready}
      YJ64_COUNCIL_WORKER_ENABLED: ${YJ64_COUNCIL_WORKER_ENABLED:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      council-worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  yj64-postgres-data:
